spring.application.name=hydra-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.forward-headers-strategy=framework
spring.session.jdbc.initialize-schema=always
spring.session.timeout=12h
server.servlet.session.cookie.name=HYDRA_SID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=12h
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
hydra.storage.type=${HYDRA_STORAGE_TYPE:local}
hydra.storage.root=${HYDRA_STORAGE_ROOT:./data/files}
hydra.s3.endpoint=${HYDRA_S3_ENDPOINT:}
hydra.s3.region=${HYDRA_S3_REGION:eu-west-1}
hydra.s3.bucket=${HYDRA_S3_BUCKET:documents}
logging.level.tn.hydra=DEBUG
logging.level.tn.hydra.document.service=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
# Log SQL errors so Vercel logs show the exact DB failure (RLS, missing seq, FK, etc.)
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR
logging.level.org.flywaydb=INFO
app.owner.email=${OWNER_EMAIL}
app.owner.password=${OWNER_PASSWORD}